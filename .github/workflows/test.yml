name: Test Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          ENV_SERP_API_KEY: ${{ secrets.ENV_SERP_API_KEY }}
          ENV_SERP_ENDPOINT_GET: ${{ secrets.ENV_SERP_ENDPOINT_GET }}
          ENV_SHEETY_ENDPOINT_GET: ${{ secrets.ENV_SHEETY_ENDPOINT_GET }}
          ENV_SHEETY_ENDPOINT_PUT: ${{ secrets.ENV_SHEETY_ENDPOINT_PUT }}
          ENV_SHEETY_ENDPOINT_POST: ${{ secrets.ENV_SHEETY_ENDPOINT_POST }}
          ENV_SHEETY_USERNAME: ${{ secrets.ENV_SHEETY_USERNAME }}
          ENV_SHEETY_PASSWORD: ${{ secrets.ENV_SHEETY_PASSWORD }}
          ENV_SHEETY_AUTH: ${{ secrets.ENV_SHEETY_AUTH }}
          ENV_EMAIL_FROM: ${{ secrets.ENV_EMAIL_FROM }}
          ENV_EMAIL_TO: ${{ secrets.ENV_EMAIL_TO }}
          ENV_EMAIL_PASSWORD: ${{ secrets.ENV_EMAIL_PASSWORD }}
          ENV_CURRENCY: ${{ secrets.ENV_CURRENCY }}
        run: |
          echo "🔍 Checking GitHub Secrets..."
          echo ""

          check_secret () {
            if [ -z "$2" ]; then
              echo "❌ $1 secret is not set!"
              echo "   Go to Settings > Secrets > Actions and add it."
              exit 1
            else
              echo "✅ $1 is configured"
            fi
          }

          check_secret "ENV_SERP_API_KEY" "$ENV_SERP_API_KEY"
          check_secret "ENV_SERP_ENDPOINT_GET" "$ENV_SERP_ENDPOINT_GET"
          check_secret "ENV_SHEETY_ENDPOINT_GET" "$ENV_SHEETY_ENDPOINT_GET"
          check_secret "ENV_SHEETY_ENDPOINT_PUT" "$ENV_SHEETY_ENDPOINT_PUT"
          check_secret "ENV_SHEETY_ENDPOINT_POST" "$ENV_SHEETY_ENDPOINT_POST"
          check_secret "ENV_SHEETY_USERNAME" "$ENV_SHEETY_USERNAME"
          check_secret "ENV_SHEETY_PASSWORD" "$ENV_SHEETY_PASSWORD"
          check_secret "ENV_SHEETY_AUTH" "$ENV_SHEETY_AUTH"
          check_secret "ENV_EMAIL_FROM" "$ENV_EMAIL_FROM"
          check_secret "ENV_EMAIL_TO" "$ENV_EMAIL_TO"
          check_secret "ENV_EMAIL_PASSWORD" "$ENV_EMAIL_PASSWORD"
          check_secret "ENV_CURRENCY" "$ENV_CURRENCY"

          echo ""
          echo "🎉 All secrets are configured!"

      - name: Check required files exist
        run: |
          echo "📁 Checking for required files..."

          check_file () {
            if [ -f "$1" ]; then
              echo "✅ $1 found"
            else
              echo "❌ $1 not found!"
              exit 1
            fi
          }

          check_file "main.py"
          check_file "requirements.txt"
          check_file "data_manager.py"
          check_file "flight_data.py"
          check_file "flight_search.py"
          check_file "notification_manager.py"

          if [ -f ".gitignore" ]; then
            echo "✅ .gitignore found"
          else
            echo "⚠️  .gitignore not found (optional)"
          fi

          if [ -f "README.md" ]; then
            echo "✅ README.md found"
          else
            echo "⚠️  README.md not found (optional)"
          fi

          if [ -f "LICENSE" ]; then
            echo "✅ LICENSE found"
          else
            echo "⚠️  LICENSE not found (optional)"
          fi

          echo ""
          echo "📁 All required files found!"

      - name: Test Python syntax
        run: |
          echo "🔍 Checking Python syntax..."
          python -m py_compile main.py
          python -m py_compile data_manager.py
          python -m py_compile flight_data.py
          python -m py_compile flight_search.py
          python -m py_compile notification_manager.py
          echo "✅ Python syntax OK"

      - name: Test imports
        run: |
          echo "🔍 Testing imports..."
          python -c "
          import os
          import requests
          import requests_cache
          import smtplib
          from email.mime.text import MIMEText
          from datetime import datetime, timedelta
          print('✅ All imports successful')
          "

      - name: Test SerpAPI connection
        env:
          ENV_SERP_API_KEY: ${{ secrets.ENV_SERP_API_KEY }}
          ENV_SERP_ENDPOINT_GET: ${{ secrets.ENV_SERP_ENDPOINT_GET }}
        run: |
          echo "🔍 Testing SerpAPI connection..."

          if [ -z "$ENV_SERP_ENDPOINT_GET" ]; then
            ENV_SERP_ENDPOINT_GET="https://serpapi.com/search"
          fi

          RESPONSE=$(curl -s "${ENV_SERP_ENDPOINT_GET}?engine=google_flights&departure_id=LHR&arrival_id=JFK&outbound_date=2026-12-01&return_date=2026-12-10&currency=EUR&api_key=${ENV_SERP_API_KEY}")

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "❌ SerpAPI test failed"
            echo "$RESPONSE" | head -c 500
            exit 1
          else
            echo "✅ SerpAPI test passed"
          fi

      - name: Test Sheety connection
        env:
          ENV_SHEETY_ENDPOINT_GET: ${{ secrets.ENV_SHEETY_ENDPOINT_GET }}
          ENV_SHEETY_AUTH: ${{ secrets.ENV_SHEETY_AUTH }}
        run: |
          echo "🔍 Testing Sheety connection..."

          RESPONSE=$(curl -s -H "Authorization: Basic ${ENV_SHEETY_AUTH}" "${ENV_SHEETY_ENDPOINT_GET}")

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "❌ Sheety test failed"
            echo "$RESPONSE" | head -c 500
            exit 1
          else
            echo "✅ Sheety test passed"
          fi

      - name: Success
        run: |
          echo ""
          echo "========================================"
          echo "  ✅ All checks passed!"
          echo "  📊 Your flight-deals-alert setup is ready."
          echo "  🚀 Run 'Scheduled Flight Deal Check' to test."
          echo "========================================"